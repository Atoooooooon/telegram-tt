name: Build and Deploy

on:
  push:
    branches:
      - master-deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Create .env file
        run: |
          cat << EOF > .env
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BASE_URL=${{ secrets.BASE_URL }}
          DEV_REDIS_HOST=${{ secrets.DEV_REDIS_HOST }}
          DEV_REDIS_PASS=${{ secrets.DEV_REDIS_PASS }}
          DEV_REDIS_PORT=${{ secrets.DEV_REDIS_PORT }}
          DEV_REDIS_DB=${{ secrets.DEV_REDIS_DB }}
          DEV_REDIS_USER=${{ secrets.DEV_REDIS_USER }}
          DEV_REDIS_TLS=${{ secrets.DEV_REDIS_TLS }}
          PROXY_HOST=0.0.0.0
          PROXY_PORT=8787
          PROXY_ALLOW_ORIGIN=*
          PROXY_ALLOW_HEADERS=content-type
          PROXY_MAX_BODY_BYTES=6000000
          PROXY_LOG=1
          ONCALL_TELEGRAM_BOT_TOKEN=${{ secrets.ONCALL_TELEGRAM_BOT_TOKEN }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:dev

      - name: Prune dev dependencies for deploy bundle
        run: npm prune --omit=dev

      - name: Package deploy bundle
        run: tar -cvf dist.tar dist server deploy node_modules package.json package-lock.json .env

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist.tar"
          target: "/root/tgweb/dist-portable-bundle"

      - name: Extract and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/tgweb/dist-portable-bundle
            rm -rf dist server deploy node_modules
            rm -f package.json package-lock.json .env
            tar -xvf dist.tar
            rm dist.tar
            bash deploy/tg_web.sh restart
